appId: io.github.dev-oleksandrv.ovd
productName: OVD
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# macOS and Ubuntu only (ADR 0013).
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ovd-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Oleksandr Voronkov
  category: Development
appImage:
  artifactName: ovd-${version}-${arch}.${ext}
deb:
  artifactName: ovd-${version}-${arch}.${ext}
npmRebuild: false
# Releases are uploaded by CI; no auto-update feed yet.
publish: null
