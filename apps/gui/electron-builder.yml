appId: io.github.dev-oleksandrv.ovd
productName: OVD
# The package name (@ovd/gui) is not a valid file name; Linux packages need an explicit one.
executableName: ovd
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# macOS and Ubuntu only (ADR 0013).
# One universal dmg for Apple Silicon and Intel. Signing and notarization run only when the
# release workflow provides credentials (ADR 0021); otherwise the build is unsigned.
mac:
  target:
    - target: dmg
      arch: [universal]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: ovd-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Oleksandr Voronkov
  category: Development
appImage:
  artifactName: ovd-${version}-${arch}.${ext}
deb:
  artifactName: ovd-${version}-${arch}.${ext}
npmRebuild: false
# Releases are uploaded by CI; no auto-update feed yet.
publish: null
