name: CI

on:
  push:
    # DIAGNOSTIC branch: runs on push, no PR needed.
    branches: [main, test/e2e-window-diagnostics]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # changeset status compares the PR against origin/main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      # The Version PR consumes changesets, so it is the one PR that legitimately has none.
      - name: Require a changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm exec changeset status --since origin/main

  # The built CLI and desktop app against a fake Vega SDK that replays fixtures/0.24 (ADR 0023).
  # Required on PRs.
  # DIAGNOSTIC: desktop flows only, 5 times on each Ubuntu image, every run reported.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        attempt: [1, 2, 3, 4, 5]
    name: 'e2e (${{ matrix.os }} run ${{ matrix.attempt }})'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The desktop app needs a display; the runner has none, so Xvfb provides one.
      - run: xvfb-run --auto-servernum pnpm run test:e2e:gui
      - name: Upload traces of failed desktop flows
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces-${{ matrix.os }}-${{ matrix.attempt }}
          path: e2e/test-results/
          if-no-files-found: ignore

  # macOS is the other supported host (ADR 0013); its runners cost more, so main only.
  e2e-macos:
    # DIAGNOSTIC: off on this branch.
    if: false
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:e2e
      - name: Upload traces of failed desktop flows
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces-macos
          path: e2e/test-results/
          if-no-files-found: ignore
